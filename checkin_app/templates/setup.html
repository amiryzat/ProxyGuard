<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyGuard Check-in Setup</title>
    <style>
        /* Minimal styling for readability only, matching the dashboard app. */
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 2rem;
            color: #222;
        }
        h1 {
            font-size: 1.5rem;
        }
        form {
            margin-top: 1rem;
        }
        .field {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            margin-bottom: 0.25rem;
            font-weight: bold;
        }
        select {
            padding: 6px 8px;
            min-width: 20rem;
            max-width: 100%;
        }
        button {
            padding: 8px 16px;
            font-size: 1rem;
            cursor: pointer;
        }
        .error {
            color: #b00000;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <h1>ProxyGuard Check-in Setup</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="/start">
        <div class="field">
            <label for="subject">Class subject:</label>
            <select id="subject" name="subject">
                {% for subject in subjects %}
                <option value="{{ subject }}">{{ subject }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="field">
            <label for="week">Week number:</label>
            <select id="week" name="week">
                {% for week in weeks %}
                <option value="{{ week }}">Week {{ week }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit">Start Session</button>
    </form>
</body>
</html>
