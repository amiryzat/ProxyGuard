<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyGuard Check-in</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/checkin.css') }}">
</head>
<body>
    <!-- Shown by default; hidden by checkin.js once the MJPEG stream's first
         frame has arrived AND /status confirms the station is active -- never
         on a fixed timeout (requirement 5/6), so the lecturer never sees a
         blank/black camera box while the feed warms up. -->
    {% include "_checkin_skeleton.html" %}

    <div class="page-container" id="real-checkin" hidden>
        <h1 class="page-title">ProxyGuard Check-in</h1>

        <!-- Class / week / session_id confirmed from the setup step. -->
        <div class="card page-section">
            <div class="session-meta-row">
                <div class="session-meta-details">
                    <strong>{{ subject }}</strong> &nbsp;&middot;&nbsp; Week {{ week_number }}
                </div>
                <span class="session-badge">{{ session_id }}</span>
            </div>
        </div>

        <!-- Current check-in state: recognizing / liveness challenge /
             success / warning / failure. Tone (color class) is set client-side
             by checkin.js from the same /status phase field. -->
        <div class="card page-section status-card" id="status-card">
            <div class="status-text" id="status">Look at the camera and follow the on-screen instruction.</div>
        </div>

        <!-- Frames are captured and processed server-side; the browser only
             displays them. All recognition/liveness overlays (head-turn
             instruction, liveness success, confirmed/failed) are drawn onto the
             streamed frames by the shared CheckinSession, so the same messages the
             desktop app shows appear here too. -->
        <div class="card page-section">
            <div class="video-frame">
                <img id="videoFeed" src="{{ url_for('video_feed') }}" alt="Live check-in camera">
            </div>
        </div>

        <div class="action-area">
            <button type="button" id="newCheck" class="btn btn-primary" disabled>New check-in (next student)</button>
            <button type="button" id="endSession" class="btn btn-ghost">End session / set up a different class</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/checkin.js') }}"></script>
</body>
</html>
