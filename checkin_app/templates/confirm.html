<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProxyGuard Session Created</title>
    <style>
        /* Minimal styling for readability only, matching the dashboard app. */
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 2rem;
            color: #222;
        }
        h1 {
            font-size: 1.5rem;
        }
        .session-id {
            font-family: "Courier New", monospace;
            font-size: 1.2rem;
            background: #f2f2f2;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 0.75rem 1rem;
            display: inline-block;
            margin: 0.5rem 0 1rem;
        }
        dl {
            margin: 0 0 1rem;
        }
        dt {
            font-weight: bold;
        }
        dd {
            margin: 0 0 0.5rem;
        }
        .note {
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Session Created</h1>

    <p>The following session ID was built from your selections:</p>
    <div class="session-id">{{ session_id }}</div>

    <dl>
        <dt>Class subject</dt>
        <dd>{{ subject }}</dd>
        <dt>Week</dt>
        <dd>Week {{ week_number }}</dd>
    </dl>

    <!-- Phase 2b will start the live camera check-in flow from here; for now
         this page only confirms the session_id was assembled correctly. -->
    <p class="note">Check-in (camera) is not part of this step yet.</p>
    <p><a href="/">Set up another session</a></p>
</body>
</html>
